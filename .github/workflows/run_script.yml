name: Find M3U8 Link

on:
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemek için
  # schedule:
  #   - cron: '0 */6 * * *' # İsterseniz her 6 saatte bir otomatik çalıştırabilirsiniz

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Playwright Tarayıcılarını Kur
        run: playwright install chromium

      - name: Betiği Çalıştır
        run: python get_m3u8.py
